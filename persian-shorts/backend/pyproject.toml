[project]
name = "persian-shorts"
version = "0.1.0"
description = "Turn long-form Persian/Farsi YouTube videos into short, engaging vertical clips"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "yt-dlp>=2024.8.6",
    "openai>=1.40",
    "anthropic>=0.34",
    "opencv-python-headless>=4.9,<5",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
